[tool.poetry]
name = "hbctool"
version = "0.2.0.dev0"
description = "A command-line interface for disassembling and assembling the Hermes Bytecode."
authors = ["bongtrop", "ErbaZZ"]
keywords = ["hbc", "hermes", "bytecode", "reverse", "hacking"]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Natural Language :: English',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.8',
]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/bongtrop/hbctool"
repository = "https://github.com/bongtrop/hbctool"
documentation = "https://github.com/bongtrop/hbctool"
include = [
    { path = "hbctool/hbc/hbc98/opcode.json", format = ["sdist", "wheel"] },
    { path = "hbctool/hbc/hbc98/reference/*", format = ["sdist", "wheel"] },
]
exclude = [
    "tests/**",
    "hbctool/hbc/*/example/**",
]

[tool.poetry.dependencies]
python = ">=3.8,<4.0"
docopt = "^0.6.2"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
hbctool = "hbctool:main"
